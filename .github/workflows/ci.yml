name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - home_assistant: "2026.7.0"
            fixture: "0.13.344"
          - home_assistant: "2026.8.1"
            fixture: "0.13.355"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: >-
          python -m pip install . ruff mypy pytest-cov
          "homeassistant==${{ matrix.home_assistant }}"
          "pytest-homeassistant-custom-component==${{ matrix.fixture }}"
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy custom_components
      - run: pytest
      - run: python scripts/validate_package.py
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test-artifacts
          path: |
            coverage.xml
            .pytest_cache
