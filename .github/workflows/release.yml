name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy custom_components
      - run: pytest
      - run: python scripts/validate_package.py
      - name: Validate tag version
        run: test "${GITHUB_REF_NAME#v}" = "$(python -c 'import json; print(json.load(open("custom_components/zweg_irrigation/manifest.json"))["version"])')"
      - name: Build release asset
        run: zip -r "zweg_irrigation-${GITHUB_REF_NAME}.zip" custom_components/zweg_irrigation
      - name: Publish release
        run: gh release create "$GITHUB_REF_NAME" "zweg_irrigation-${GITHUB_REF_NAME}.zip" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
